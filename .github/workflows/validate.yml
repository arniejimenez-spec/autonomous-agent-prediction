name: validate-agent

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv
          uv pip install --prerelease=allow --python .venv/bin/python -r requirements.txt
      - name: Validate Agent Config
        run: |
          .venv/bin/python validate_submission.py --agent-dir submissions/01_robust_automl/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/02_order_aware_automl/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/03_fail_safe_automl/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/04_adaptive_automl_v3/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/05_selection_stable_automl_v4/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/06_interaction_routed_automl_v5/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/07_tree_diversity_automl_v6/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/08_fingerprint_routed_automl_v7/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/09_meta_routed_automl_v8/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/10_runtime_safe_dgp_v81/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/11_full_refit_bagging_v9/agent
          .venv/bin/python validate_submission.py --agent-dir submissions/12_cv_gated_mlp_v10/agent
      - name: Check Python syntax
        run: .venv/bin/python -m compileall -q scripts submissions/01_robust_automl/agent submissions/02_order_aware_automl/agent submissions/03_fail_safe_automl/agent submissions/04_adaptive_automl_v3/agent submissions/05_selection_stable_automl_v4/agent submissions/06_interaction_routed_automl_v5/agent submissions/07_tree_diversity_automl_v6/agent submissions/08_fingerprint_routed_automl_v7/agent submissions/09_meta_routed_automl_v8/agent submissions/10_runtime_safe_dgp_v81/agent submissions/11_full_refit_bagging_v9/agent submissions/12_cv_gated_mlp_v10/agent
        env:
          PYTHONPYCACHEPREFIX: /tmp/autonomous-agent-pycache
      - name: Build artifacts
        run: |
          .venv/bin/python scripts/build_notebook.py
          .venv/bin/python scripts/build_notebook.py --experiment 02_order_aware_automl --output notebooks/build_agent_submission_v2.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 03_fail_safe_automl --output notebooks/build_agent_submission_v21.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 04_adaptive_automl_v3 --output notebooks/build_agent_submission_v3.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v3.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 05_selection_stable_automl_v4 --output notebooks/build_agent_submission_v4.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v4.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 06_interaction_routed_automl_v5 --output notebooks/build_agent_submission_v5.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v5.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 07_tree_diversity_automl_v6 --output notebooks/build_agent_submission_v6.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v6.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 08_fingerprint_routed_automl_v7 --output notebooks/build_agent_submission_v7.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v7.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 09_meta_routed_automl_v8 --output notebooks/build_agent_submission_v8.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v8.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 10_runtime_safe_dgp_v81 --output notebooks/build_agent_submission_v81.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v81.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 11_full_refit_bagging_v9 --output notebooks/build_agent_submission_v9.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v9.ipynb
          .venv/bin/python scripts/build_notebook.py --experiment 12_cv_gated_mlp_v10 --output notebooks/build_agent_submission_v10.ipynb
          .venv/bin/python scripts/verify_notebook.py notebooks/build_agent_submission_v10.ipynb
          .venv/bin/python scripts/package_submission.py
          .venv/bin/python scripts/package_submission.py --experiment 02_order_aware_automl
          .venv/bin/python scripts/package_submission.py --experiment 03_fail_safe_automl
          .venv/bin/python scripts/package_submission.py --experiment 04_adaptive_automl_v3
          .venv/bin/python scripts/package_submission.py --experiment 05_selection_stable_automl_v4
          .venv/bin/python scripts/package_submission.py --experiment 06_interaction_routed_automl_v5
          .venv/bin/python scripts/package_submission.py --experiment 07_tree_diversity_automl_v6
          .venv/bin/python scripts/package_submission.py --experiment 08_fingerprint_routed_automl_v7
          .venv/bin/python scripts/package_submission.py --experiment 09_meta_routed_automl_v8
          .venv/bin/python scripts/package_submission.py --experiment 10_runtime_safe_dgp_v81
          .venv/bin/python scripts/package_submission.py --experiment 11_full_refit_bagging_v9
          .venv/bin/python scripts/package_submission.py --experiment 12_cv_gated_mlp_v10
      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-agent-submission
          path: |
            submissions/01_robust_automl/submission.zip
            submissions/02_order_aware_automl/submission.zip
            submissions/03_fail_safe_automl/submission.zip
            submissions/04_adaptive_automl_v3/submission.zip
            submissions/05_selection_stable_automl_v4/submission.zip
            submissions/06_interaction_routed_automl_v5/submission.zip
            submissions/07_tree_diversity_automl_v6/submission.zip
            submissions/08_fingerprint_routed_automl_v7/submission.zip
            submissions/09_meta_routed_automl_v8/submission.zip
            submissions/10_runtime_safe_dgp_v81/submission.zip
            submissions/11_full_refit_bagging_v9/submission.zip
            submissions/12_cv_gated_mlp_v10/submission.zip
