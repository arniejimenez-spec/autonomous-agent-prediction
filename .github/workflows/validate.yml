name: validate-agent

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --no-dev || uv pip install --system -r requirements.txt
      - name: Validate Agent Config
        run: uv run python validate_submission.py --agent-dir submissions/01_robust_automl/agent
      - name: Check Python syntax
        run: uv run python -m py_compile submissions/01_robust_automl/agent/skills/tabular-automl/scripts/automl.py scripts/*.py
      - name: Build artifacts
        run: |
          uv run python scripts/build_notebook.py
          uv run python scripts/package_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: kaggle-agent-submission
          path: submissions/01_robust_automl/submission.zip
